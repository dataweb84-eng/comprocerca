<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel comercio — ComproCerca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="topbar">
  <h1 id="nombre-negocio">Panel comercio</h1>
  <button class="chico secundario" style="background:#fff;" onclick="logout()">Salir</button>
</div>

<div class="contenedor">
  <div class="tabs">
    <button id="tab-pedidos" class="activo" onclick="cambiarTab('pedidos')">Pedidos</button>
    <button id="tab-productos" onclick="cambiarTab('productos')">Productos</button>
    <button id="tab-qr" onclick="cambiarTab('qr')">Mi QR</button>
    <button id="tab-planes" onclick="cambiarTab('planes')">Planes</button>
    <button id="tab-perfil" onclick="cambiarTab('perfil')">Mi comercio</button>
  </div>

  <div id="vista-pedidos"></div>

  <div id="vista-productos" class="oculto">
    <div class="tarjeta">
      <h4 style="margin-top:0;">Nuevo producto</h4>
      <label>Nombre</label>
      <input id="p-nombre" />
      <label>Descripción</label>
      <input id="p-descripcion" />
      <div class="fila">
        <div>
          <label>Precio</label>
          <input id="p-precio" type="number" step="any" />
        </div>
        <div>
          <label>Unidad</label>
          <input id="p-unidad" placeholder="kg, gramos, unidad..." />
        </div>
      </div>
      <div id="p-error" class="err"></div>
      <button class="ancho" style="margin-top:12px;" onclick="crearProducto()">Agregar producto</button>
    </div>
    <div id="lista-productos"></div>
  </div>

  <div id="vista-qr" class="oculto">
    <div class="tarjeta" style="text-align:center;">
      <h4 style="margin-top:0;">Invitá a tus clientes con tu QR</h4>
      <p style="color:var(--texto-suave);font-size:13px;">
        Imprimilo y pegalo en el mostrador, o compartilo por WhatsApp: al escanearlo,
        tus clientes entran directo a tu vidriera en ComproCerca.
      </p>
      <div id="qr-codigo" style="display:flex;justify-content:center;margin:16px 0;"></div>
      <div class="fila">
        <input id="qr-link" readonly style="text-align:center;font-size:12px;" />
        <button class="secundario chico" onclick="copiarLinkQr()">Copiar link</button>
      </div>
      <button class="ancho" style="margin-top:14px;" onclick="descargarQr()">Descargar QR</button>
      <div id="qr-msg" class="ok"></div>
    </div>
  </div>

  <div id="vista-planes" class="oculto">
    <div id="plan-actual-info" class="tarjeta"></div>
    <div id="plan-solicitud-info"></div>
    <div id="lista-planes-comercio"></div>
    <div class="tarjeta">
      <p style="margin:0;font-size:12px;color:var(--texto-suave);">
        💬 ¿Dudas sobre los planes? Escribinos y te ayudamos a elegir el que mejor te sirve.
      </p>
    </div>
  </div>

  <div id="vista-perfil" class="oculto">
    <div class="tarjeta">
      <label>Dirección</label>
      <input id="perfil-direccion" />
      <label>Teléfono</label>
      <input id="perfil-telefono" />
      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;">
        <input type="checkbox" id="perfil-envio" style="width:auto;" /> Ofrezco envío
      </label>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="perfil-retiro" style="width:auto;" /> Ofrezco retiro en local
      </label>
      <div id="perfil-msg" class="ok"></div>
      <button class="ancho" style="margin-top:14px;" onclick="guardarPerfil()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="/js/comercio-admin.js"></script>
</body>
</html>
