<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ingreso comercios — ComproCerca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="tarjeta form-login">
  <h2>Ingreso comercios</h2>
  <label>Usuario</label>
  <input id="username" />
  <label>Contraseña</label>
  <input id="password" type="password" />
  <div id="error" class="err"></div>
  <button class="ancho" style="margin-top:16px;" onclick="login()">Ingresar</button>
  <p style="text-align:center;color:var(--texto-suave);font-size:13px;margin-top:16px;">
    ¿Todavía no estás en ComproCerca?<br/>
    <a href="/registro-comercio.html" style="color:var(--verde-oscuro);font-weight:700;">Registrá tu comercio gratis →</a>
  </p>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  const res = await fetch('/api/comercio/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Error al ingresar'; return; }
  location.href = '/comercio-admin.html';
}
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
